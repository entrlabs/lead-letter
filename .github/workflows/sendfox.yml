name: Send Lead Letter Email

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/signals/**'
      - '.github/sendfox-drafts/**'
      - 'scripts/sendfox-*.mjs'
      - 'package.json'
      - '.github/workflows/sendfox.yml'
  workflow_dispatch:
    inputs:
      signal_file:
        description: Existing Signals Brief path to draft, for example src/content/signals/2026-w30-make-every-handoff-ownable.md
        required: true
        type: string

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  sendfox:
    name: Validate SendFox and prepare email
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate SendFox secrets
        env:
          SENDFOX_API_TOKEN: ${{ secrets.SENDFOX_API_TOKEN }}
          SENDFOX_LIST_ID: ${{ secrets.SENDFOX_LIST_ID }}
          SENDFOX_API_BASE: ${{ vars.SENDFOX_API_BASE || 'https://api.sendfox.com' }}
          SENDFOX_LISTS_ENDPOINT: ${{ vars.SENDFOX_LISTS_ENDPOINT || '/lists' }}
        run: npm run sendfox:check

      - name: Find newly added Lead Letters
        env:
          DISPATCH_SIGNAL_FILE: ${{ inputs.signal_file }}
        run: |
          validate_signal_file() {
            case "$1" in
              src/content/signals/*.md) ;;
              *)
                echo "Signals Brief must be a Markdown file inside src/content/signals: $1"
                exit 1
                ;;
            esac

            if [ ! -f "$1" ]; then
              echo "Signals Brief not found: $1"
              exit 1
            fi
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            validate_signal_file "$DISPATCH_SIGNAL_FILE"
            printf '%s\n' "$DISPATCH_SIGNAL_FILE" > added-signal-files.txt
            exit 0
          fi

          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-status -r "$HEAD" -- src/content/signals .github/sendfox-drafts > changed-signal-files.txt
          else
            git diff --name-status "$BASE" "$HEAD" -- src/content/signals .github/sendfox-drafts > changed-signal-files.txt
          fi

          awk '$1 == "A" && $2 ~ /^src\/content\/signals\/.*\.md$/ { print $2 }' changed-signal-files.txt > added-signal-files.txt
          awk '$1 == "A" && $2 ~ /^\.github\/sendfox-drafts\/.*\.txt$/ { print $2 }' changed-signal-files.txt > added-draft-request-files.txt

          while IFS= read -r request_file; do
            signal_file="$(sed -n '1p' "$request_file")"
            validate_signal_file "$signal_file"
            printf '%s\n' "$signal_file" >> added-signal-files.txt
          done < added-draft-request-files.txt

          sort -u -o added-signal-files.txt added-signal-files.txt
          cat added-signal-files.txt

      - name: Validate forward-facing email
        run: |
          if [ -s added-signal-files.txt ]; then
            while IFS= read -r signal_file; do
              npm run check:sendfox-email -- "$signal_file"
            done < added-signal-files.txt
          else
            npm run check:sendfox-email
          fi

      - name: Allow Pages deploy to settle
        if: github.event_name == 'push'
        run: sleep 90

      - name: Send Lead Letter to SendFox
        env:
          LEAD_LETTER_SITE_URL: https://letters.entr.cc
          SENDFOX_API_TOKEN: ${{ secrets.SENDFOX_API_TOKEN }}
          SENDFOX_LIST_ID: ${{ secrets.SENDFOX_LIST_ID }}
          SENDFOX_SEND_ENABLED: ${{ vars.SENDFOX_SEND_ENABLED || 'false' }}
          SENDFOX_DEDUPLICATE_CAMPAIGNS: 'true'
          SENDFOX_CAMPAIGN_TITLE_PREFIX: Lead Letter Weekly
          SENDFOX_API_BASE: ${{ vars.SENDFOX_API_BASE || 'https://api.sendfox.com' }}
          SENDFOX_API_ENDPOINT: ${{ vars.SENDFOX_API_ENDPOINT || '/campaigns' }}
          SENDFOX_API_METHOD: ${{ vars.SENDFOX_API_METHOD || 'POST' }}
          SENDFOX_SUBJECT_PREFIX: ${{ vars.SENDFOX_SUBJECT_PREFIX || '' }}
          SENDFOX_FROM_NAME: ${{ vars.SENDFOX_FROM_NAME || 'The Lead Letter' }}
          SENDFOX_FROM_EMAIL: ${{ vars.SENDFOX_FROM_EMAIL || 'letters@entr.cc' }}
        run: npm run sendfox:lead-letter -- added-signal-files.txt
